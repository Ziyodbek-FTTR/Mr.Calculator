<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr.Calculator</title>
    <!-- Math engine: math.js (parser, symbolic derivative, matrices, statistics). No eval() is used anywhere. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>
    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            --navy: #0f1f3d;
            --blue: #2563eb;
            --blue-d: #1d4ed8;
            --tint: #eaf1ff;
            --bg: #f5f7fb;
            --line: #e0e5ed;
            --text: #172033;
            --mute: #5f6b7d;
            --ok: #16794c;
            --okbg: #ecf8f2;
            --err: #b42318;
            --errbg: #fdf0ee
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            background: var(--bg);
            color: var(--text)
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
            color: inherit
        }

        /* ===== LAYOUT ===== */
        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column
        }

        header {
            height: 68px;
            background: var(--navy);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 34px
        }

        .brand {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -.5px;
            color: #fff
        }

        .brand span {
            color: #6ea0ff
        }

        nav {
            display: flex;
            gap: 26px
        }

        nav button {
            border: 0;
            background: none;
            color: #aebbd3;
            font-size: 14px;
            cursor: pointer;
            padding: 8px 2px;
            border-bottom: 2px solid transparent
        }

        nav button:hover {
            color: #fff
        }

        nav button.active {
            color: #fff;
            border-color: #6ea0ff
        }

        .layout {
            flex: 1;
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr)
        }

        aside {
            background: #fff;
            border-right: 1px solid var(--line);
            padding: 24px 16px
        }

        .side-title {
            font-size: 12px;
            font-weight: 700;
            color: #8a94a6;
            margin: 18px 12px 8px
        }

        .side-title:first-child {
            margin-top: 0
        }

        .category {
            width: 100%;
            text-align: left;
            border: 0;
            background: none;
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--mute);
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 2px
        }

        .category:hover {
            background: #f2f5fa;
            color: var(--text)
        }

        .category.selected {
            background: var(--tint);
            color: var(--blue);
            font-weight: 700
        }

        main {
            padding: 40px 48px;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto
        }

        h1 {
            margin: 0 0 6px;
            font-size: 30px;
            letter-spacing: -.7px
        }

        .subtitle {
            margin: 0 0 24px;
            color: var(--mute);
            font-size: 15px
        }

        .workspace {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 24px
        }

        /* ===== FORM CONTROLS ===== */
        .ops {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px
        }

        .op {
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
            color: var(--mute)
        }

        .op.on {
            background: var(--navy);
            border-color: var(--navy);
            color: #fff
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin: 0 0 7px
        }

        .field {
            margin-bottom: 14px
        }

        .hint {
            font-size: 12.5px;
            color: var(--mute);
            margin-top: 5px
        }

        input[type=text],
        textarea,
        select {
            width: 100%;
            border: 1px solid #cfd6e2;
            border-radius: 9px;
            padding: 12px 14px;
            font-size: 17px;
            background: #fff;
            outline: none
        }

        textarea {
            resize: vertical
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px var(--tint)
        }

        .btn {
            border: 0;
            border-radius: 9px;
            padding: 13px 26px;
            background: var(--blue);
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer
        }

        .btn:hover {
            background: var(--blue-d)
        }

        .btn.ghost {
            background: #fff;
            color: var(--blue);
            border: 1px solid #cfd6e2;
            font-weight: 600;
            padding: 12px 16px
        }

        .btn.ghost:hover {
            background: var(--tint)
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center
        }

        /* ===== RESULT ===== */
        .result {
            margin-top: 24px;
            border-top: 1px solid #e8ebf0;
            padding-top: 20px
        }

        .rhead {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px
        }

        .rhead span {
            color: #8a94a6;
            font-size: 13px
        }

        #answer {
            min-height: 76px;
            background: #f7f9fc;
            border: 1px solid #e5e9f0;
            border-radius: 10px;
            padding: 18px 20px;
            font-size: 24px;
            font-weight: 700;
            overflow-wrap: anywhere
        }

        #answer.ok {
            background: var(--okbg);
            border-color: #bfe5d1;
            color: var(--ok)
        }

        #answer.err {
            background: var(--errbg);
            border-color: #f3c6c0;
            color: var(--err);
            font-size: 16px;
            font-weight: 600
        }

        .kv {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 6px 22px;
            font-size: 17px
        }

        .kv b {
            color: var(--mute);
            font-weight: 600
        }

        table.mx {
            border-collapse: collapse;
            font-size: 18px
        }

        table.mx td {
            padding: 6px 14px;
            border-left: 2px solid var(--navy);
            border-right: 2px solid var(--navy);
            text-align: right
        }

        .steps {
            margin-top: 14px;
            border: 1px solid #e5e9f0;
            border-radius: 10px;
            padding: 14px 18px
        }

        .steps summary {
            cursor: pointer;
            font-weight: 700;
            font-size: 14px
        }

        .steps ol {
            margin: 12px 0 0;
            padding-left: 22px;
            color: #3a465b;
            font-size: 15px;
            line-height: 1.75
        }

        /* ===== GRAPHING ===== */
        .grow {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center
        }

        .grow i {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex: none
        }

        .grow input {
            font-size: 16px;
            padding: 9px 12px
        }

        .grow .bad {
            border-color: var(--err)
        }

        #cv {
            width: 100%;
            height: 480px;
            border: 1px solid var(--line);
            border-radius: 10px;
            cursor: grab;
            display: block;
            touch-action: none;
            background: #fff
        }

        #cv:active {
            cursor: grabbing
        }

        /* ===== HISTORY / SETTINGS ===== */
        .hitem {
            padding: 12px 0;
            border-bottom: 1px solid #eef1f5;
            font-size: 15px
        }

        .hitem small {
            color: #8a94a6;
            display: block;
            margin-bottom: 2px
        }

        .set {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 10px 20px;
            align-items: center;
            max-width: 560px
        }

        .set select {
            font-size: 15px;
            padding: 9px 12px
        }

        @media(max-width:800px) {
            .layout {
                grid-template-columns: 1fr
            }

            aside {
                border-right: 0;
                border-bottom: 1px solid var(--line)
            }

            main {
                padding: 24px 18px
            }

            header {
                padding: 0 18px
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <header>
            <div class="brand">Mr<span>.</span>Calculator</div>
            <nav>
                <button id="homeBtn" class="active" type="button">Home</button>
                <button id="historyBtn" type="button">History</button>
                <button id="settingsBtn" type="button">Settings</button>
            </nav>
        </header>
        <div class="layout">
            <aside id="side"></aside>
            <main id="main"></main>
        </div>
    </div>

    <script>
        /* =====================================================================
           STATE + SETTINGS  (session only: nothing is written to localStorage)
           ===================================================================== */
        const S = {deg: true, prec: 6, notation: 'auto'};
        const hist = [];
        let view = 'home', cat = 'solve', opi = 0;
        const $ = id => document.getElementById(id);
        const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

        /* =====================================================================
           MATHEMATICAL ENGINE (math.js parser + helpers)
           ===================================================================== */
        /* Convert natural notation into math.js syntax. */
        function pre(s) {
            return s.replace(/×|·/g, '*').replace(/÷/g, '/').replace(/[−–]/g, '-').replace(/π/g, 'pi')
                .replace(/√\s*\(/g, 'sqrt(').replace(/√\s*([0-9.]+|[a-z]+)/gi, 'sqrt($1)')
                .replace(/°/g, ' deg').replace(/²/g, '^2').replace(/³/g, '^3').replace(/\bln\b/g, 'log');
        }
        /* Angle handling: math.js is radian-based, so wrap trig functions to obey the Degrees/Radians setting. */
        const toRad = x => math.typeOf(x) === 'Unit' ? x.toNumber('rad') : (S.deg ? x * Math.PI / 180 : x);
        const fromRad = x => S.deg ? x * 180 / Math.PI : x;
        function scope() {
            return {
                sin: x => math.sin(toRad(x)), cos: x => math.cos(toRad(x)), tan: x => math.tan(toRad(x)),
                asin: x => fromRad(Math.asin(x)), acos: x => fromRad(Math.acos(x)), atan: x => fromRad(Math.atan(x))
            };
        }
        /* Format a value using the precision / notation settings. */
        function fmt(v) {
            if (typeof v === 'number') {
                if (!isFinite(v)) throw new Error('The result is not a finite number (division by zero or overflow).');
                if (S.notation === 'sci') return v.toExponential(S.prec);
                if (S.notation === 'fixed') return v.toFixed(S.prec);
                const r = +v.toFixed(S.prec);
                return String(r === 0 && v !== 0 ? v.toExponential(Math.max(S.prec - 1, 1)) : r);
            }
            return math.format(v, {precision: Math.max(S.prec, 1) + 2});
        }
        const n = fmt;
        const isZero = v => Math.abs(v) < 1e-12;
        /* Signed term helper: " + 5x" / " − 5x" */
        const term = (c, t) => (c < 0 ? ' − ' : ' + ') + n(Math.abs(c)) + t;
        function hasVar(expr, name) {return math.parse(expr).filter(nd => nd.isSymbolNode && nd.name === name).length > 0;}
        function num(str, what) {
            const v = math.evaluate(pre(str), scope());
            if (typeof v !== 'number' || !isFinite(v)) throw new Error(what + ' must be a finite number.');
            return v;
        }
        function list(str, what) {
            const a = str.split(/[\s,;]+/).filter(Boolean).map(Number);
            if (!a.length || a.some(isNaN)) throw new Error(what + ': enter numbers separated by commas or spaces, e.g. 4, 8, 15, 16.');
            return a;
        }
        function matrix(str, what) {
            const m = math.evaluate(pre(str));
            const a = m && m.toArray ? m.toArray() : null;
            if (!a || !Array.isArray(a[0])) throw new Error(what + ' must be a matrix such as [[1,2],[3,4]].');
            return a;
        }

        /* =====================================================================
           TOOLS: each operation = { name, fields[], ex[], run(...values) -> {answer, steps} }
           ===================================================================== */
        /* ---- Calculator ---- */
        const calculatorOps = [{
            name: 'Evaluate', fields: [{l: 'Expression', ph: 'e.g. (25 + 15) × 3', hint: 'Supports + − × ÷ ^ √ ! % brackets, π, e, sin cos tan, ln, log10, sqrt, scientific notation (1.5e3) and units of angle such as 30 deg.'}],
            ex: ['(25 + 15) × 3'],
            run(e) {
                const p = pre(e), r = math.evaluate(p, scope());
                if (r === undefined || typeof r === 'function') throw new Error('That is not a calculable expression.');
                return {answer: fmt(r), steps: ['Read the input as: ' + p, 'Evaluated following the order of operations (brackets, powers, × ÷, + −). Trigonometry uses ' + (S.deg ? 'degrees' : 'radians') + '.', 'Result: ' + fmt(r), 'Note: a line-by-line breakdown of arbitrary expressions is not generated; the value is computed exactly by the parser.']};
            }
        }];
        /* ---- Algebra ---- */
        function quadCoeffs(L, R) {
            const f = x => {const v = math.evaluate('(' + L + ')-(' + R + ')', Object.assign({x}, scope())); if (typeof v !== 'number') throw new Error('Unsupported expression.'); return v;};
            const c = f(0), a = (f(1) + f(-1)) / 2 - c, b = (f(1) - f(-1)) / 2;
            [2, 3, -2].forEach(x => {if (Math.abs(f(x) - (a * x * x + b * x + c)) > 1e-7 * (1 + Math.abs(f(x)))) throw new Error('Only linear and quadratic equations in x are supported here.');});
            return {a, b, c};
        }
        function solveEquation(eq) {
            const parts = pre(eq).split('=');
            if (parts.length !== 2 || !parts[0].trim() || !parts[1].trim()) throw new Error('Enter exactly one equation containing "=", e.g. 2x + 5 = 15.');
            const [L, R] = parts;
            if (!hasVar(L, 'x') && !hasVar(R, 'x')) throw new Error('The equation must contain the variable x.');
            const {a, b, c} = quadCoeffs(L, R);
            const check = x => 'Check: substituting x = ' + n(x) + ' gives ' + n(math.evaluate(L, {x})) + ' on the left and ' + n(math.evaluate(R, {x})) + ' on the right.';
            const st = ['Move all terms to one side: ' + (isZero(a) ? '' : n(a) + 'x²') + (isZero(b) ? '' : (isZero(a) ? n(b) : term(b, '')) + 'x') + (isZero(c) ? '' : (isZero(a) && isZero(b) ? n(c) : term(c, ''))) + ' = 0'];
            if (isZero(a) && isZero(b)) return {answer: isZero(c) ? 'Infinitely many solutions (identity)' : 'No solution', steps: st.concat(isZero(c) ? ['Both sides are always equal.'] : ['This reduces to ' + n(c) + ' = 0, which is false.'])};
            if (isZero(a)) {
                const x = -c / b;
                return {answer: 'x = ' + n(x), steps: st.concat(['Subtract ' + n(c) + ' from both sides: ' + n(b) + 'x = ' + n(-c), 'Divide both sides by ' + n(b) + ': x = ' + n(-c) + ' / ' + n(b) + ' = ' + n(x), check(x)])};
            }
            const D = b * b - 4 * a * c;
            st.push('Identify a = ' + n(a) + ', b = ' + n(b) + ', c = ' + n(c), 'Discriminant D = b² − 4ac = ' + n(b) + '² − 4·' + n(a) + '·' + n(c) + ' = ' + n(D));
            if (isZero(D)) {const x = -b / (2 * a); return {answer: 'x = ' + n(x) + ' (repeated root)', steps: st.concat(['D = 0, so there is one repeated root: x = −b / 2a = ' + n(x), check(x)])};}
            if (D > 0) {
                const x1 = (-b + Math.sqrt(D)) / (2 * a), x2 = (-b - Math.sqrt(D)) / (2 * a);
                return {answer: [['x₁', n(x1)], ['x₂', n(x2)]], steps: st.concat(['D > 0, so there are two real roots: x = (−b ± √D) / 2a', 'x₁ = (' + n(-b) + ' + √' + n(D) + ') / ' + n(2 * a) + ' = ' + n(x1), 'x₂ = (' + n(-b) + ' − √' + n(D) + ') / ' + n(2 * a) + ' = ' + n(x2), check(x1), check(x2)])};
            }
            const re = -b / (2 * a), im = Math.sqrt(-D) / (2 * Math.abs(a));
            return {answer: [['x₁', n(re) + ' + ' + n(im) + 'i'], ['x₂', n(re) + ' − ' + n(im) + 'i']], steps: st.concat(['D < 0, so there are no real roots; the roots are complex conjugates.', 'x = −b / 2a ± (√(−D) / 2a)i = ' + n(re) + ' ± ' + n(im) + 'i'])};
        }
        function solveSystem(text) {
            const eqs = text.split(/[\n;]+/).map(s => s.trim()).filter(Boolean);
            if (eqs.length !== 2) throw new Error('Enter exactly two equations in x and y, one per line.');
            const co = eqs.map(q => {
                const p = pre(q).split('=');
                if (p.length !== 2) throw new Error('Each line must be an equation containing "=".');
                const f = (x, y) => {const v = math.evaluate('(' + p[0] + ')-(' + p[1] + ')', Object.assign({x, y}, scope())); if (typeof v !== 'number') throw new Error('Unsupported expression.'); return v;};
                const c = f(0, 0), a = f(1, 0) - c, b = f(0, 1) - c;
                if (Math.abs(f(1, 1) - (a + b + c)) > 1e-9 || Math.abs(f(2, -1) - (2 * a - b + c)) > 1e-9) throw new Error('Only linear equations in x and y are supported.');
                return {a, b, k: -c};
            });
            const [e1, e2] = co, D = e1.a * e2.b - e2.a * e1.b;
            const eq = e => n(e.a) + 'x' + term(e.b, 'y') + ' = ' + n(e.k);
            const st = ['Write in standard form:', '   (1) ' + eq(e1), '   (2) ' + eq(e2), 'Cramer\'s rule: D = a₁b₂ − a₂b₁ = ' + n(D)];
            if (isZero(D)) return {answer: 'No unique solution', steps: st.concat(['D = 0: the lines are parallel (no solution) or identical (infinitely many).'])};
            const Dx = e1.k * e2.b - e2.k * e1.b, Dy = e1.a * e2.k - e2.a * e1.k, x = Dx / D, y = Dy / D;
            return {answer: [['x', n(x)], ['y', n(y)]], steps: st.concat(['Dx = k₁b₂ − k₂b₁ = ' + n(Dx), 'Dy = a₁k₂ − a₂k₁ = ' + n(Dy), 'x = Dx / D = ' + n(x), 'y = Dy / D = ' + n(y), 'Check (1): ' + n(e1.a * x + e1.b * y) + ' = ' + n(e1.k) + ';  check (2): ' + n(e2.a * x + e2.b * y) + ' = ' + n(e2.k)])};
        }
        const algebraOps = [
            {name: 'Solve equation', fields: [{l: 'Equation in x', ph: 'e.g. 2x + 5 = 15', hint: 'Linear or quadratic, such as x² + 5x + 6 = 0.'}], ex: ['x² + 5x + 6 = 0'], run: solveEquation},
            {name: 'Solve system (2 unknowns)', fields: [{l: 'Two equations in x and y', ph: '2x + y = 10\nx - y = 2', area: 1, hint: 'One equation per line (or separated by ;).'}], ex: ['2x + y = 10\nx - y = 2'], run: solveSystem},
            {
                name: 'Simplify', fields: [{l: 'Expression', ph: 'e.g. 2x + 3x - x^2 + 4x^2'}], ex: ['2x + 3x - x^2 + 4x^2'],
                run(e) {const r = math.simplify(pre(e)).toString(); return {answer: r, steps: ['Collected like terms and applied algebraic rewrite rules to: ' + pre(e), 'Simplified form: ' + r, 'Note: expanding and factoring are not available yet.']};}
            }
        ];
        /* ---- Calculus ---- */
        const calculusOps = [
            {
                name: 'Derivative', fields: [{l: 'Function of x', ph: 'e.g. x^2 * sin(x)'}, {l: 'Order (1 = first derivative)', ph: '1', opt: 1}, {l: 'Slope at x = (optional)', ph: 'e.g. 2', opt: 1}],
                ex: ['x^3 + 2x', '2', ''],
                run(f, ord, at) {
                    const k = ord ? Math.round(num(ord, 'Order')) : 1;
                    if (k < 1 || k > 6) throw new Error('Order must be between 1 and 6.');
                    let d = math.parse(pre(f)); const st = ['f(x) = ' + d.toString()];
                    for (let i = 1; i <= k; i++) {d = math.simplify(math.derivative(d, 'x')); st.push('Differentiate (power, product, quotient and chain rules) and simplify: f' + "′".repeat(i > 3 ? 1 : i) + (i > 3 ? '⁽' + i + '⁾' : '') + '(x) = ' + d.toString());}
                    const out = [['f' + (k > 1 ? '⁽' + k + '⁾' : '′') + '(x)', d.toString()]];
                    if (at) {const x = num(at, 'x'), v = d.evaluate(Object.assign({x}, scope())); out.push(['Value at x = ' + n(x), n(v)]); st.push('Substitute x = ' + n(x) + ': ' + n(v));}
                    return {answer: out, steps: st};
                }
            },
            {
                name: 'Definite integral', fields: [{l: 'Function of x', ph: 'e.g. x^2'}, {l: 'Lower limit a', ph: '0'}, {l: 'Upper limit b', ph: '3'}], ex: ['x^2', '0', '3'],
                run(f, A, B) {
                    const a = num(A, 'Lower limit'), b = num(B, 'Upper limit'), node = math.compile(pre(f)), sc = scope(), N = 2000, h = (b - a) / N;
                    const g = x => {sc.x = x; const v = node.evaluate(sc); if (typeof v !== 'number' || !isFinite(v)) throw new Error('The function is undefined or infinite at x = ' + n(x) + '; the integral cannot be computed numerically.'); return v;};
                    let s = g(a) + g(b); for (let i = 1; i < N; i++) s += g(a + i * h) * (i % 2 ? 4 : 2);
                    const v = s * h / 3;
                    return {answer: '≈ ' + n(v), steps: ['Compute ∫ from ' + n(a) + ' to ' + n(b) + ' of ' + pre(f) + ' dx', 'Method: Simpson\'s rule with 2000 sub-intervals (numerical approximation, no symbolic antiderivative is shown).', 'Result ≈ ' + n(v), 'Indefinite integrals are not available yet.']};
                }
            },
            {
                name: 'Limit', fields: [{l: 'Function of x', ph: 'e.g. sin(x)/x'}, {l: 'x approaches', ph: '0'}], ex: ['sin(x)/x', '0'],
                run(f, P) {
                    const p = num(P, 'Target'), node = math.compile(pre(f)), sc = scope();

            const x0 = G.cx - W / 2 / G.sc, x1 = G.cx + W / 2 / G.sc, y0 = G.cy - H / 2 / G.sc, y1 = G.cy + H / 2 / G.sc;
            g.font = '12px "Segoe UI",Arial'; g.lineWidth = 1;
            for (let x = Math.ceil(x0 / st) * st; x <= x1; x += st) {g.strokeStyle = '#e6ebf3'; g.beginPath(); g.moveTo(X(x), 0); g.lineTo(X(x), H); g.stroke();}
            for (let y = Math.ceil(y0 / st) * st; y <= y1; y += st) {g.strokeStyle = '#e6ebf3'; g.beginPath(); g.moveTo(0, Y(y)); g.lineTo(W, Y(y)); g.stroke();}
            g.strokeStyle = '#0f1f3d'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(X(0), 0); g.lineTo(X(0), H); g.moveTo(0, Y(0)); g.lineTo(W, Y(0)); g.stroke();
            g.fillStyle = '#5f6b7d'; const ax = Math.min(Math.max(X(0), 0), W - 4), ay = Math.min(Math.max(Y(0), 12), H - 4), lab = v => +v.toPrecision(6);
            g.textAlign = 'center'; for (let x = Math.ceil(x0 / st) * st; x <= x1; x += st) if (Math.abs(x) > st / 2) g.fillText(lab(x), X(x), Math.min(ay + 14, H - 4));
            g.textAlign = 'right'; for (let y = Math.ceil(y0 / st) * st; y <= y1; y += st) if (Math.abs(y) > st / 2) g.fillText(lab(y), Math.min(ax - 5, W - 6) < 24 ? 28 : ax - 5, Y(y) + 4);
            g.fillText('0', ax - 5, ay + 14);
            const sc = scope(); let bad = false;
            document.querySelectorAll('[data-fn]').forEach(inp => {
                const i = +inp.dataset.fn, src = G.fns[i].replace(/^\s*y\s*=/i, '').trim(); inp.classList.remove('bad');
                if (!src) return;
                let node; try {node = math.compile(pre(src)); node.evaluate(Object.assign({x: 1}, sc));} catch (e) {inp.classList.add('bad'); bad = true; return;}
                g.strokeStyle = COLORS[i % 6]; g.lineWidth = 2.2; g.beginPath(); let pen = false, py = 0;
                for (let px = 0; px <= W; px++) {
                    sc.x = G.cx + (px - W / 2) / G.sc; let y; try {y = node.evaluate(sc);} catch (e) {y = NaN;}
                    const sy = typeof y === 'number' ? Y(y) : NaN;
                    if (!isFinite(sy) || Math.abs(sy) > 1e5) {pen = false; continue;}
                    if (pen && Math.abs(sy - py) < H * 2) g.lineTo(px, sy); else g.moveTo(px, sy);
                    pen = true; py = sy;
                }
                g.stroke();
            });
            c._t = {X, Y, W, H};
        }
        (function graphEvents() {
            let drag = null;
            document.addEventListener('mousedown', e => {if (e.target.id === 'cv') drag = {x: e.clientX, y: e.clientY, cx: G.cx, cy: G.cy};});
            window.addEventListener('mouseup', () => drag = null);
            window.addEventListener('mousemove', e => {
                if (drag) {G.cx = drag.cx - (e.clientX - drag.x) / G.sc; G.cy = drag.cy + (e.clientY - drag.y) / G.sc; drawGraph();}
                else if (e.target.id === 'cv') {const r = e.target.getBoundingClientRect(); $('coord').textContent = 'x = ' + +(G.cx + (e.clientX - r.left - r.width / 2) / G.sc).toPrecision(5) + ',  y = ' + +(G.cy - (e.clientY - r.top - r.height / 2) / G.sc).toPrecision(5);}
            });
            document.addEventListener('wheel', e => {
                if (e.target.id !== 'cv') return; e.preventDefault();
                const r = e.target.getBoundingClientRect(), mx = G.cx + (e.clientX - r.left - r.width / 2) / G.sc, my = G.cy - (e.clientY - r.top - r.height / 2) / G.sc;
                G.sc = Math.min(Math.max(G.sc * (e.deltaY < 0 ? 1.15 : 1 / 1.15), 0.05), 1e6);
                G.cx = mx - (e.clientX - r.left - r.width / 2) / G.sc; G.cy = my + (e.clientY - r.top - r.height / 2) / G.sc; drawGraph();
            }, {passive: false});
            window.addEventListener('resize', drawGraph);
        })();

        /* =====================================================================
           EVENT WIRING (delegated, so re-rendering never loses handlers)
           ===================================================================== */
        $('homeBtn').onclick = () => setView('home');
        $('historyBtn').onclick = () => setView('history');
        $('settingsBtn').onclick = () => setView('settings');
        document.addEventListener('click', e => {
            const t = e.target, id = t.id;
            if (t.dataset.cat) {cat = t.dataset.cat; opi = 0; setView('home');}
            else if (t.dataset.op) {opi = +t.dataset.op; renderMain();}
            else if (id === 'go') calculate();
            else if (id === 'ex') TOOLS[cat].ops[opi].ex.forEach((v, i) => $('f' + i).value = v);
            else if (id === 'clearH') {hist.length = 0; renderHistory();}
            else if (id === 'addFn') {G.fns.push(''); drawRows(); const l = document.querySelectorAll('[data-fn]'); l[l.length - 1].focus();}
            else if (t.dataset.rm) {G.fns.splice(+t.dataset.rm, 1); drawRows(); drawGraph();}
            else if (id === 'resetView') {G.cx = 0; G.cy = 0; G.sc = 40; drawGraph();}
        });
        document.addEventListener('input', e => {
            if (e.target.dataset.fn !== undefined) {G.fns[+e.target.dataset.fn] = e.target.value; drawGraph(); clearTimeout(G.t); G.t = setTimeout(() => {const v = G.fns.filter(f => f.trim()).join(' ; '); if (v && G.fns.every(f => !f.trim() || !document.querySelector('.bad'))) {if (hist.length && hist[hist.length - 1].cat === 'Graphing') hist.pop(); hist.push({cat: 'Graphing', op: 'Plot', input: v, res: 'Graph displayed'});} }, 1200);}
        });
        document.addEventListener('keydown', e => {if (e.key === 'Enter' && !e.shiftKey && /^f\d$/.test(e.target.id || '')) {e.preventDefault(); calculate();} });
        document.addEventListener('change', e => {
            if (e.target.id === 'sAngle') S.deg = e.target.value === 'deg';
            if (e.target.id === 'sPrec') S.prec = +e.target.value;
            if (e.target.id === 'sNot') S.notation = e.target.value;
        });

        /* Start: fail clearly if the math library could not load (for example, when offline). */
        if (typeof math === 'undefined') {
            $('main').innerHTML = '<h1>Math engine not loaded</h1><p class="subtitle">Mr.Calculator needs an internet connection to load the math.js library from cdnjs.cloudflare.com. Reconnect and reload the page.</p>';
        } else setView('home');
    </script>
